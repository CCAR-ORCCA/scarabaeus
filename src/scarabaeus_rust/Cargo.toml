[package]
name = "rust"
version = "1.0.0"
edition = "2024"
license = "ISC"
authors = ["Orbital Research Cluster for Celestial Applications (ORCCA) Lab, University of Colorado at Boulder"]

[lib]
name = "scarabaeus_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python-extension"]
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = {version = "0.27.2"}
numpy = {version = "0.27"}
ndarray = {version = "0.17"}
itertools = {version = "0.12"}
nalgebra = {version = "0.34"}
num-dual = {version = "0.13"}
