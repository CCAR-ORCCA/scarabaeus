#
# Licensing for files that cannot carry an SPDX comment header (images,
# JSON, kernels, generated files). Every other file states its own license
# in its first lines. Check with `reuse lint` from the repository root.
version = 1

# Notebooks: the header lives in the first markdown cell, which REUSE cannot
# parse inside the JSON, so this entry replaces whatever the file says.
[[annotations]]
path = "tutorials/*.ipynb"
precedence = "override"
SPDX-FileCopyrightText = "2026 Orbital Research Cluster for Celestial Applications (ORCCA) Lab, University of Colorado at Boulder"
SPDX-License-Identifier = "ISC"

# Scarabaeus images, data and generated files.
[[annotations]]
path = [
    "docs/images/OD_cartwheel.png",
    "docs/images/data_flow.png",
    "docs/images/mass_prop_flow.png",
    "docs/images/units_dataflow_dark.png",
    "docs/images/units_dataflow_light.png",
    "docs/images/scarabaeus_logo.png",
    "docs/images/scarabaeus_logo_dark.png",
    "docs/images/readme_images/*.png",
    "docs/images/external _resource_images/*.png",
    # Written by release_notes/release_gen.py and conf.py at build time.
    "docs/online_documentation/sphinx_files/release_notes/release_frontpage.rst",
    "docs/online_documentation/sphinx_files/release_notes/versions/*.rst",
    "docs/online_documentation/sphinx_files/api_ref/utils/planetary_constants_table.rst.inc",
    "docs/online_documentation/sphinx_files/user_guide/quickstart/quickstart_mk.tm",
    "src/scarabaeus/.vscode/launch.json",
    "tests/python_tests/reports/*.xml",
